[project]
name = "telco_churn"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.6",
    "joblib>=1.3",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.49"]
notebooks = ["matplotlib>=3.7", "seaborn>=0.13", "pandera>=0.20", "statsmodels>=0.14", "shap>=0.44"]
dev = ["nbformat>=5.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"